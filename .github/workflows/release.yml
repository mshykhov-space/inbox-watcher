name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon -PreleaseVersion="${GITHUB_REF_NAME#v}" check build installDist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run rulesync:install
      - run: npm run rulesync:check
      - name: Package distribution
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tar -C build/install -czf "inbox-watcher-${tag}.tar.gz" inbox-watcher
          sha256sum "inbox-watcher-${tag}.tar.gz" > "inbox-watcher-${tag}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-watcher-distribution
          path: inbox-watcher-*.tar.gz*
          if-no-files-found: error

  publish-image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish release assets
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inbox-watcher-distribution
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            inbox-watcher-*.tar.gz
            inbox-watcher-*.tar.gz.sha256
